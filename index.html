<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="J_Lz-CkoWAGfVObiUkGbOmTDrsKYlKIiee4ImsdpBmI" />
<title>802.11be EHT Waveform Explorer</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f3f6fb;
    --panel: #ffffff;
    --panel2: #fafcff;
    --ink: #1a2236;
    --ink-dim: #4a5570;
    --ink-muted: #8893ab;
    --accent: #2563eb;        /* bright blue */
    --accent2: #0ea5b7;       /* bright teal */
    --pink: #db5a8a;
    --green: #16a34a;
    --orange: #ea7c3a;
    --red: #dc2a55;
    --purple: #7c5ce0;
    --line: #e3e8f0;
    --code: 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; }
  body { min-height:100vh; }
  .app { max-width: 1620px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 4px; font-weight: 700; }
  .sub { color: var(--ink-dim); font-size: 14px; margin-bottom: 20px; }
  .pill { display:inline-block; padding: 2px 9px; border-radius: 4px; background: var(--bg2); color: var(--accent); font-size: 11px; font-family: var(--code); margin-right:6px; letter-spacing:0.04em; text-transform: uppercase; border:1px solid var(--line); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(30,50,90,0.05); }
  .panel h2 { font-size: 16px; margin: 0 0 14px; letter-spacing: 0.02em; display:flex; align-items:center; gap:10px; }
  .panel h2 .num { width:24px; height:24px; border-radius:4px; background: var(--accent); color: #fff; font-size:12px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }
  .panel h2 .desc { color: var(--ink-dim); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .col { flex:1 1 0; min-width: 260px; }
  .ctrls { display:grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .ctrl label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-muted); margin-bottom:4px; }
  .ctrl select, .ctrl input { width:100%; background: var(--bg2); color: var(--ink); border:1px solid var(--line); border-radius:5px; padding:7px 10px; font-family: var(--code); font-size:13px; }
  .ctrl input[type="range"] { padding:0; }
  .ctrl .val { color: var(--accent); font-family: var(--code); font-size:13px; }

  .kbd { font-family: var(--code); font-size: 12px; background: var(--bg2); padding: 1px 6px; border-radius: 4px; border:1px solid var(--line); }
  .num-big { font-family: var(--code); font-size: 24px; color: var(--accent); font-weight: 700; }
  .num-mid { font-family: var(--code); font-size: 16px; color: var(--accent2); font-weight:600; }
  .label { font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-muted); }
  .stat { padding:10px 14px; background: var(--bg2); border-radius:6px; border:1px solid var(--line); }
  .grid4 { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
  .grid3 { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  .grid2 { display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; }

  /* Timeline */
  .tl { position:relative; height: 110px; background: var(--bg2); border-radius:8px; overflow:hidden; display:flex; border:2px solid #1a2236; }
  .tl-seg { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition: filter 0.15s; border-right:2px solid #1a2236; color:#fff; padding: 6px 4px; }
  .tl-seg:last-child { border-right: none; }
  .tl-seg:hover, .tl-seg.active { filter: brightness(0.92); }
  .tl-seg .nm { font-size:14px; font-weight:700; }
  .tl-seg .du { font-family: var(--code); font-size:11px; opacity:0.85; margin-top:3px; }
  .tl-axis { display:flex; justify-content:space-between; font-family: var(--code); font-size:10px; color: var(--ink-muted); margin-top:4px; padding: 0 2px; }

  /* Concentric */
  .conc { padding: 14px; border-radius: 10px; display:flex; flex-direction:column; gap:0; }
  .conc-layer { padding: 12px 14px; border-radius: 10px; margin: 4px; position:relative; }
  .conc-layer .ll { font-size:10px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.8; }
  .conc-layer .nm { font-weight: 700; font-size: 14px; }
  .conc-layer .vv { font-family: var(--code); font-size: 12px; opacity:0.95; }

  /* Bit stream segments — small variant (legacy / inline) */
  .bitstream { display:flex; height:42px; border-radius:8px; overflow:hidden; border:1px solid var(--line); margin: 8px 0 4px; }
  .bs-seg { display:flex; align-items:center; justify-content:center; flex-direction:column; font-size:11px; font-weight:600; cursor:default; transition: filter 0.15s; }
  .bs-seg:hover { filter: brightness(1.2); }
  .bs-seg .b { font-family: var(--code); font-size:10px; opacity: 0.85; }
  .bs-legend { display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color: var(--ink-dim); }
  .bs-legend .sw { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:middle; margin-right:5px; }

  /* Big-bar variant — matches PPDU Timeline visual scale */
  .bigbar { position:relative; height:110px; background: var(--bg2); border-radius:8px; overflow:hidden; display:flex; border:2px solid #1a2236; }
  .bigbar-seg { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:default; transition: filter 0.15s; border-right:2px solid #1a2236; color:#fff; padding:6px 8px; min-width: 0; overflow:hidden; }
  .bigbar-seg:last-child { border-right: none; }
  .bigbar-seg:hover { filter: brightness(0.92); }
  .bigbar-seg.clickable { cursor:pointer; }
  .bigbar-seg.active { filter: brightness(0.85); box-shadow: inset 0 0 0 3px rgba(255,255,255,0.5); }
  .bigbar-seg .nm { font-size:14px; font-weight:700; line-height:1.15; text-align:center; }
  .bigbar-seg .du { font-family: var(--code); font-size:11px; opacity:0.88; margin-top:3px; }
  .bigbar-axis { display:flex; justify-content:space-between; font-family: var(--code); font-size:10px; color: var(--ink-muted); margin-top:4px; padding: 0 2px; }
  .bigbar-legend { display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--ink-dim); margin-top:10px; }
  .bigbar-legend .sw { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:middle; margin-right:5px; border:1px solid rgba(0,0,0,0.15); }

  /* Subcarrier map — bumped up + black framing */
  .sc-canvas-wrap { background: var(--bg2); border-radius:8px; padding:14px; border:2px solid #1a2236; }
  .sc-legend { display:flex; gap:14px; font-size:11px; margin-top:10px; flex-wrap:wrap; color:var(--ink-dim); }
  .sc-legend .sw { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:middle; margin-right:5px; border:1px solid rgba(0,0,0,0.15); }

  /* Pipeline stages */
  .stages { display:flex; flex-direction:column; gap:0; }
  .stage { padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--bg2); margin-bottom:2px; position:relative; cursor:pointer; transition: background 0.15s; border-radius:0 4px 4px 0; }
  .stage:hover { background: #e9eef8; }
  .stage.expanded { background: #e9eef8; }
  .stage .head { display:flex; align-items:center; gap:10px; }
  .stage .stage-n { font-family: var(--code); font-size: 11px; color: var(--ink-muted); width: 30px; }
  .stage .stage-t { font-weight: 600; font-size: 13px; flex:1; }
  .stage .stage-v { font-family: var(--code); font-size: 12px; color: var(--accent2); }
  .stage .arrow { color: var(--ink-muted); transition: transform 0.2s; }
  .stage.expanded .arrow { transform: rotate(90deg); color: var(--accent); }
  .stage .body { display:none; padding: 10px 0 4px 40px; font-size: 12px; color: var(--ink-dim); line-height:1.55; }
  .stage.expanded .body { display: block; }
  .stage code { font-family: var(--code); background: #fff; padding: 1px 6px; border-radius: 3px; color: var(--accent); border:1px solid var(--line); }

  /* Tabs */
  .tabs { display:flex; gap:4px; margin-bottom: 14px; border-bottom:1px solid var(--line); padding-bottom:0; }
  .tab { padding: 8px 14px; cursor:pointer; font-size:13px; color: var(--ink-dim); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* MAC header bit table */
  .mac-tbl { width:100%; border-collapse: collapse; font-size:12px; }
  .mac-tbl th, .mac-tbl td { padding: 6px 10px; text-align:left; border-bottom: 1px solid var(--line); font-family: var(--code); }
  .mac-tbl th { color: var(--ink-muted); text-transform:uppercase; font-size:10px; letter-spacing:0.08em; font-weight:500; }
  .mac-tbl tr:hover td { background: #f6f9ff; }
  .mac-tbl .field-name { color: var(--accent2); font-family: -apple-system, sans-serif; font-weight:500; }
  .mac-tbl .hex { color: var(--accent); }

  /* FC bit-by-bit */
  .bits { display:flex; gap:2px; font-family: var(--code); font-size:11px; }
  .bit { min-width: 38px; padding: 6px 4px; text-align:center; border-radius: 4px; border:1px solid var(--line); }
  .bit .bn { font-size:9px; color: var(--ink-muted); display:block; }
  .bit .bv { font-weight:700; }

  /* MCS table */
  .mcs-tbl { width:100%; border-collapse: collapse; font-size:12px; font-family: var(--code); }
  .mcs-tbl th, .mcs-tbl td { padding: 4px 8px; text-align:right; border-bottom: 1px solid var(--line); }
  .mcs-tbl th { color: var(--ink-muted); font-weight:500; font-size:10px; }
  .mcs-tbl tr.cur td { background: #dfe9ff; color: var(--accent); font-weight:700; }

  /* CRC list */
  .crc-list { display:flex; flex-direction: column; gap: 8px; }
  .crc-item { display:flex; align-items:center; gap:12px; padding: 8px 12px; background: var(--bg2); border-radius: 6px; border-left: 3px solid var(--accent2); border:1px solid var(--line); border-left-width:3px; }
  .crc-item .name { flex:1; font-weight:600; font-size:13px; }
  .crc-item .scope { color: var(--ink-dim); font-size:11px; font-family: var(--code); }
  .crc-item .algo { color: var(--accent2); font-family: var(--code); font-size:11px; }

  /* Constellation */
  canvas.const { background: #f8fbff; border-radius:6px; border:1px solid var(--line); }

  /* tooltip / detail panel */
  .detail { background: var(--bg2); border-radius:6px; padding:12px 14px; margin-top:10px; font-size:13px; line-height:1.6; border:1px solid var(--line); }
  .detail h3 { margin:0 0 6px; font-size:14px; color: var(--accent); }
  .detail .desc { color: var(--ink-dim); margin-bottom: 8px; }
  .detail .kv { display:grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-family: var(--code); font-size:12px; }
  .detail .kv .k { color: var(--ink-muted); }
  .detail .kv .v { color: var(--green); }

  .scroll { max-height: 360px; overflow-y: auto; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  .badge-warn { background: #fff1e0; color: var(--orange); padding:2px 8px; border-radius:4px; font-size:11px; font-family: var(--code); }
  .badge-ok { background: #e1f7e7; color: var(--green); padding:2px 8px; border-radius:4px; font-size:11px; font-family: var(--code); }

  .footer { color: var(--ink-muted); font-size:11px; text-align:center; margin: 30px 0 16px; }

  /* Mobile / narrow-viewport: keep canvases from blowing past their container */
  canvas, svg { max-width: 100%; height: auto; }
  .panel canvas { max-width: 100%; }
  /* Allow tables in compact panels to scroll horizontally on mobile */
  .panel table { max-width: 100%; }
  @media (max-width: 900px) {
    .app { padding: 12px; }
    .ctrls { grid-template-columns: repeat(2, 1fr); }
    .hl-row { grid-template-columns: repeat(2, 1fr); }
    .grid4 { grid-template-columns: repeat(2, 1fr); }
    nav[style*="position: sticky"] { display: none; }
  }
  /* Inline-help cursor on jargon terms with title= attributes */
  abbr[title], span[title] { text-decoration: underline dotted var(--ink-muted); cursor: help; }

  .hl-row { display:grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 14px; }
  .hl-card { background: var(--bg2); border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  .hl-card .lab { font-size:10px; text-transform:uppercase; color: var(--ink-muted); letter-spacing:0.08em; }
  .hl-card .vv { font-family: var(--code); font-size:18px; color: var(--accent); font-weight:700; margin-top:2px; }
  .hl-card .un { color: var(--ink-dim); font-size:11px; margin-left:4px; }
</style>
</head>
<body>
<div class="app" id="root"></div>

<!-- React + Babel CDNs. SRI integrity attributes intentionally omitted for
     development convenience: when the bundled hash drifts from the actual CDN
     contents the browser blocks the script and the page renders blank, which
     is more often a deployment surprise than a security win for an internal
     learning tool. Re-add `integrity="sha384-..." crossorigin="anonymous"`
     once the deployment story is settled. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<!-- Plain-JS data and math: LDPC Annex F base matrices + QC expansion / GF(2)
     elimination utilities. Loaded BEFORE Babel-transpiled scripts so JSX modules
     can reference window.EHT_LDPC. NOT type="text/babel" (no JSX, just data). -->
<script src="eht_ldpc_matrices.js"></script>
<!-- EHT-LTF 4x sequence for BW=320 (canonical reference case): 4073-element
     ±1 LUT used by genEHTLTF in the bit-perfect preamble path. Plain JS. -->
<script src="eht_ltf_320_4x.js"></script>

<!-- Compute layer (length pipeline, CRCs, MCS table, spec data tables). -->
<script type="text/babel" src="eht_compute.jsx"></script>
<!-- Numeric pipeline (scrambler, LDPC encode, constellation, tone-map, pilots,
     IFFT, Data field synthesis, field generators). Triggered by an explicit
     "Generate Waveform" button in the React app, not on every parameter change. -->
<script type="text/babel" src="eht_pipeline.jsx"></script>

<!-- React UI components, split horizontally for readability + faster Babel
     parse per file. Order matters only insofar as the orchestrator (eht_app.jsx)
     loads last. -->
<script type="text/babel" src="eht_app1.jsx"></script>
<script type="text/babel" src="eht_app2.jsx"></script>
<script type="text/babel" src="eht_app3.jsx"></script>
<script type="text/babel" src="eht_app4.jsx"></script>
<script type="text/babel" src="eht_app5.jsx"></script>
<script type="text/babel" src="eht_app6.jsx"></script>
<script type="text/babel" src="eht_app7.jsx"></script>
<script type="text/babel" src="eht_scrambler.jsx"></script>
<script type="text/babel" src="eht_app8.jsx"></script>
<script type="text/babel" src="eht_app.jsx"></script>
</body>
</html>
